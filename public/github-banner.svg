<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img" aria-label="Tomasz Kielar - Full-Stack Developer">
  <style>
    @font-face{font-family:'ChakraP';src:url("data:font/woff2;charset=utf-8;base64,") format("woff2");font-weight:700;}
    @font-face{font-family:'PlexM';src:url("data:font/woff2;charset=utf-8;base64,") format("woff2");font-weight:400;}
    .title{font-family:'ChakraP','Chakra Petch',sans-serif;font-weight:700;font-size:54px;letter-spacing:2px;}
    .sub{font-family:'PlexM','IBM Plex Mono',monospace;font-size:16px;letter-spacing:7px;}
    .tag{font-family:'PlexM','IBM Plex Mono',monospace;font-size:11px;letter-spacing:4px;}
  </style>

  <defs>
    <clipPath id="glitchTop"><rect x="0" y="40" width="820" height="38"/></clipPath>
    <clipPath id="glitchBottom"><rect x="0" y="78" width="820" height="42"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="rgba(255,45,154,0.06)"/>
    </pattern>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="rgba(255,45,154,0.12)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="820" height="200" fill="#000000"/>
  <rect width="820" height="200" fill="url(#grid)" opacity="0.6"/>
  <rect width="820" height="200" fill="url(#scan)"/>

  <!-- frame corners -->
  <g stroke="#00b7c4" stroke-width="2" fill="none" opacity="0.9">
    <path d="M14 34V14H34"/>
    <path d="M786 14H806V34"/>
    <path d="M806 166V186H786"/>
    <path d="M34 186H14V166"/>
  </g>

  <!-- glitch title: offset layers clipped like .glitch::before/::after -->
  <g text-anchor="middle">
    <g clip-path="url(#glitchTop)" opacity="0.6">
      <text x="412" y="102" class="title" fill="#7ffcff" transform="translate(2,-1)">TOMASZ KIELAR
        <animate attributeName="opacity" values="1;0.2;1;1" keyTimes="0;0.46;0.62;1" dur="5s" repeatCount="indefinite"/>
      </text>
    </g>
    <g clip-path="url(#glitchBottom)" opacity="0.6">
      <text x="408" y="102" class="title" fill="#00c9d6" transform="translate(-2,1)">TOMASZ KIELAR
        <animate attributeName="opacity" values="1;1;0.15;1" keyTimes="0;0.5;0.66;1" dur="5s" repeatCount="indefinite"/>
      </text>
    </g>
    <text x="410" y="102" class="title" fill="#00f5ff" filter="url(#glow)">TOMASZ KIELAR
      <animate attributeName="opacity" values="0.9;0.65;1;0.9" keyTimes="0;0.45;0.6;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- subtitle -->
  <text x="413" y="140" text-anchor="middle" class="sub" fill="#7ffcff">FULL-STACK DEVELOPER</text>

  <!-- footer tags -->
  <text x="48" y="178" class="tag" fill="#00b7c4">&gt; signal intact_</text>
  <text x="772" y="178" text-anchor="end" class="tag" fill="#00b7c4">k1eu.dev</text>

  <!-- sparkles -->
  <g fill="#00f5ff">
    <path d="M120 58l3 6 6 3-6 3-3 6-3-6-6-3 6-3 3-6z" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M700 130l2.4 4.8 4.8 2.4-4.8 2.4-2.4 4.8-2.4-4.8-4.8-2.4 4.8-2.4 2.4-4.8z" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.15;0.6" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="655" cy="52" r="2.5" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="150" r="2" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
